            - paragraph [ref=e447]: At Nu, each step of the process is meticulously orchestrated to guarantee the highest quality and respect for our commitments to the environment and your well-being. We carefully select our raw materials, favoring French sources whenever possible, for their exceptional quality and ethical provenance. Committed to an organic approach certified by Cosmos, we ensure that our ingredients are pure and respectful of your skin and the environment. Our manufacturing process is artisanal, with each product crafted with love and expertise. Join us in our quest for quality and sustainability with Nu.

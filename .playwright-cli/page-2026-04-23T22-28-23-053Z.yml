            - paragraph [ref=e458]: Reduce Impact, Preserve Quality
            - paragraph [ref=e459]: At Nu, we take a minimalist approach to packaging, favoring little packaging and sustainable fibers. Our eco-responsible packaging is the result of a committed approach at each stage. By using the rice printing system and collaborating with a local printing company, we are reducing our carbon footprint while supporting the local economy. Each packaging is designed to minimize its impact on the environment, while preserving the quality and aesthetics of our products. Join us in our commitment to planet-friendly packaging with Nu.

            - paragraph [ref=e483]: Let's choose a sustainable future together
            - paragraph [ref=e484]: At Nu, we place great importance on the sustainability of our shipments, particularly taking into account the last mile principle, known for its significant environmental impact. Therefore, to minimize our carbon footprint, we encourage you to choose the relay point delivery option, especially for those who live in the city. This approach reduces emissions linked to home delivery, by promoting more efficient journeys and limiting individual trips. Together, let's choose environmentally friendly shipping with Nu.
